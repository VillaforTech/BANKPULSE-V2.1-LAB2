server:
  port: 8086
spring:
  application:
    name: social-split-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bankpulse_domains?currentSchema=social_split}
    username: ${SPRING_DATASOURCE_USERNAME:split_owner}
    password: ${SPRING_DATASOURCE_PASSWORD:split_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:redpanda:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
social-split:
  events-topic: ${SOCIAL_SPLIT_EVENTS_TOPIC:bankpulse.social-split.events.v1}
  outbox:
    poll-ms: ${SOCIAL_SPLIT_OUTBOX_POLL_MS:100}
management:
  endpoints.web.exposure.include: health,info,metrics,prometheus
  endpoint.health.probes.enabled: true
